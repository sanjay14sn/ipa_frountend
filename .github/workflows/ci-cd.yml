name: CI/CD

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --production --audit-level=high

      - name: Lint
        run: npm run lint

      # Catches the UI-consistency rules eslint cannot express (raw <table>,
      # palette residue, hex-in-className). The allowlist has been in the repo
      # since the UI overhaul but nothing ever ran it, so it could only ever
      # have grown.
      - name: UI consistency
        run: npm run check:ui

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_CLIENT_TELEMETRY_ENABLED: "true"

  deploy:
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && missing="$missing SSH_PRIVATE_KEY"
          [ -z "${{ secrets.SSH_HOST }}"        ] && missing="$missing SSH_HOST"
          [ -z "${{ secrets.SSH_USER }}"        ] && missing="$missing SSH_USER"
          [ -z "${{ secrets.NEXT_PUBLIC_API_URL }}" ] && missing="$missing NEXT_PUBLIC_API_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Populate known_hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -o ConnectTimeout=30 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "set -e; source ~/.nvm/nvm.sh; cd /home/ashwin/ipa/ipa-front && git pull origin main && npm ci && NEXT_PUBLIC_API_URL='${{ secrets.NEXT_PUBLIC_API_URL }}' NEXT_PUBLIC_RAZORPAY_KEY_ID='${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}' npm run build && pm2 reload ipa-front"
