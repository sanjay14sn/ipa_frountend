name: CI/CD

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate NEXT_PUBLIC_API_URL secret
        run: |
          if [ -z "${{ secrets.NEXT_PUBLIC_API_URL }}" ]; then
            echo "::error::Missing required secret: NEXT_PUBLIC_API_URL"
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && missing="$missing SSH_PRIVATE_KEY"
          [ -z "${{ secrets.SSH_HOST }}"        ] && missing="$missing SSH_HOST"
          [ -z "${{ secrets.SSH_USER }}"        ] && missing="$missing SSH_USER"
          [ -z "${{ secrets.NEXT_PUBLIC_API_URL }}" ] && missing="$missing NEXT_PUBLIC_API_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Populate known_hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -o ConnectTimeout=30 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "set -e; source ~/.nvm/nvm.sh; cd /home/ashwin/ipa/ipa-front && git pull origin main && npm ci && NEXT_PUBLIC_API_URL='${{ secrets.NEXT_PUBLIC_API_URL }}' npm run build && pm2 reload ipa-front"
